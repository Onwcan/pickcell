name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # This job is the integration test.
  #
  # motionkit, robot-contracts and safeedge are fetched from their published
  # repositories, so a broken export, a renamed target or a header that only
  # resolves in-tree fails here. That is the point: it consumes them the way a
  # third party would, and nothing else in the column checks that from outside.
  # Its own job rather than a step on the build: checking formatting needs no
  # compiler and no dependencies, so it has no reason to wait behind protobuf
  # and every reason to fail in thirty seconds instead of ten minutes.
  format:
    name: formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format-18
      # The same script a developer runs, so the two cannot drift.
      - name: Check formatting
        run: bash scripts/format.sh --check

  build:
    name: build against the published dependencies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build g++-14

      # protobuf comes in through robot-contracts and is the bulk of the build.
      - name: Cache dependency builds
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: pickcell-deps-${{ runner.os }}-g++14-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        env:
          CC: gcc-14
          CXX: g++-14
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j "$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # Deterministic: arithmetic over figures already measured, not a fresh
      # measurement, so it belongs in this job rather than beside the timing one.
      # It lives here for a second reason too -- this is the job that builds
      # every target. The first version sat in the reaction job, which builds
      # only `pickcell-reaction` to keep itself quick, so the binary it needed
      # had never been compiled and the step failed on a missing file rather
      # than on anything it was meant to check.
      #
      # The invariant is the one the whole report rests on: a slower link can
      # never permit more speed through the same gap.
      - name: The stopping-distance report holds its own invariants
        run: |
          bash scripts/report-safety-distance.sh build /tmp/distance-evidence             | tee distance.txt
          shared="$(awk '/^ +200 mm/ { print $3 }' distance.txt)"
          polled="$(awk '/^ +200 mm/ { print $6 }' distance.txt)"
          if [ -z "$shared" ] || [ -z "$polled" ]; then
            echo "could not find the 200 mm row in the report" >&2
            exit 1
          fi
          echo "through 200 mm: shared memory ${shared} m/s, 200 ms poll ${polled} m/s"
          awk -v a="$shared" -v b="$polled" 'BEGIN { exit (a > b) ? 0 : 1 }' || {
            echo "the slower link permitted at least as much speed" >&2
            exit 1
          }

      # Integrity of the frozen artifacts, verifiable by anyone with one standard
      # command. Deliberately outside the C++ runtime: a file check is no reason
      # to pull a crypto dependency into a library, and an external party should
      # not need to build this repository to confirm the bytes they were sent.
      # Git history remains the actual publication record; this makes accidental
      # or silent modification fail loudly.
      - name: The frozen artifacts match their recorded digests
        run: |
          cd docs/external-validation
          sha256sum -c MANIFEST.sha256
          # An artifact nobody recorded is an artifact nobody can verify.
          for f in README.md *.json *.csv; do
            grep -q "  $f\$" MANIFEST.sha256 || {
              echo "$f is not listed in MANIFEST.sha256" >&2
              exit 1
            }
          done

      # The drift test in the suite asserts the committed package matches the
      # generator, but both sides come from the same code -- so a malformed
      # string would round trip happily. This is the only check that the files an
      # external party is asked to consume actually parse, and that the pin they
      # rest on is real.
      - name: The frozen validation package is well formed
        run: |
          python3 - <<'EOF'
          import io, json, re
          scenario = json.load(io.open('docs/external-validation/scenario-v1.json'))
          prediction = json.load(io.open('docs/external-validation/prediction-v1.json'))
          assert scenario['scenario_id'] == prediction['scenario_id']
          assert scenario['version'] == prediction['version']
          assert scenario['frozen'] is True
          assert prediction['preregistered'] is True
          assert prediction['agreement_rule']['fixed_before_any_external_result'] is True
          assert scenario['hazard_plane']['interacts_with_the_body'] is False, 'the hazard plane must not be a physical collider'
          segments = scenario['commanded_braking_law']['segments']
          assert len(segments) == scenario['commanded_braking_law']['segment_count']
          assert all(s['duration_s'] > 0 for s in segments), 'a described segment is degenerate'
          # A floating dependency would mean the SHA does not identify the
          # stopping law, which is the whole basis of the pre-registration.
          for name, rev in scenario['implementation_provenance'].items():
              if name in ('provenance', 'note'):
                  continue
              assert re.fullmatch(r'[0-9a-f]{40}', rev), '%s is not pinned: %s' % (name, rev)
          print('validation package OK:', scenario['scenario_id'],
                'v%d,' % scenario['version'], len(segments), 'segments,',
                'total(T) = %s*T + %s m' % (
                    prediction['prediction_is_a_function_of_reaction_time']['initial_velocity_mps'],
                    prediction['prediction_is_a_function_of_reaction_time']['braking_distance_m']))
          EOF

      - name: Upload the stopping-distance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safety-distance-${{ github.run_id }}
          path: distance.txt
          if-no-files-found: warn

  # The measurement, re-run on a different machine.
  #
  # Absolute timings on a shared CI runner are not trustworthy and this job does
  # not assert on them. What it asserts is the *relationship*: the polled link's
  # worst case must not exceed the poll interval by more than a small margin,
  # because that bound is arithmetic rather than a property of the hardware. If
  # that stops holding, either the measurement is broken or the link is.
  reaction:
    name: the reaction bound holds
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build g++-14

      - name: Cache dependency builds
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: pickcell-deps-${{ runner.os }}-g++14-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure and build
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j "$(nproc)" --target pickcell-reaction

      - name: Measure
        run: |
          ./build/src/pickcell-reaction --trials 15 --poll-ms 50 | tee reaction.txt

      - name: The polled worst case must not exceed the poll interval
        run: |
          # Extract the HTTP link's max, in microseconds, and compare against the
          # 50 ms poll interval with 50% headroom for a loaded shared runner.
          max_us="$(awk '/HTTP poll/ { print $(NF) }' reaction.txt)"
          if [ -z "$max_us" ]; then
            echo "could not find the HTTP link's max in the output" >&2
            exit 1
          fi
          echo "HTTP link worst case: ${max_us} us against a 50000 us poll interval"
          awk -v m="$max_us" 'BEGIN { exit (m > 75000) ? 1 : 0 }' || {
            echo "worst case exceeded the poll interval by more than the headroom" >&2
            exit 1
          }

      - name: Upload the run's measurement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reaction-${{ github.run_id }}
          path: reaction.txt
          if-no-files-found: error

  container:
    name: image builds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t pickcell:ci .
      - name: The binaries are present and runnable
        run: |
          docker run --rm --entrypoint /usr/local/bin/pickcell-reaction \
            pickcell:ci --trials 3 --poll-ms 25
